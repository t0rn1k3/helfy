services:
  mysql:
    image: mysql:8.4
    container_name: helfy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: helfy_root_password
      MYSQL_DATABASE: helfy_ecommerce
      MYSQL_USER: helfy
      MYSQL_PASSWORD: helfy_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phelfy_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  adminer:
    image: adminer:latest
    container_name: helfy-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha-dark

volumes:
  mysql_data:
    name: helfy_mysql_data
